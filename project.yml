# Optional fallback: regenerate LineupLab.xcodeproj with XcodeGen (`xcodegen generate`).
# The checked-in LineupLab.xcodeproj is the source of truth; this file exists so the
# project can be rebuilt from scratch if it is ever corrupted.
name: LineupLab
options:
  bundleIdPrefix: com.lineuplab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "1600"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  LineupLab:
    type: application
    platform: iOS
    sources:
      - path: LineupLab
    settings:
      base:
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.lineuplab.LineupLab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  LineupLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LineupLabTests
    dependencies:
      - target: LineupLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lineuplab.LineupLabTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LineupLab:
    build:
      targets:
        LineupLab: all
    test:
      targets:
        - LineupLabTests
